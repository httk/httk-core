[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "httk-core"
# While httk-core 2+ is in prerelease it doesn't follow semver (or more exactly,
# it follows semver 0.* semantics, where the non-major versions do not need to adhere to semver).
# Its minor version should always stay 0, and only the patch-level be increased.
version = "2.0.2"
description = "httk₂ core functionality"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Rickard Armiento", email = "rickard-gpg@armiento.net" }]
dependencies = [
]
keywords = [
  "Materials Discovery",
  "Materials Informatics",
  "Materials Science",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://httk.org"
Documentation = "https://docs.httk.org/httk-core/"
Repository = "https://github.com/httk/httk-core"
Issues = "https://github.com/httk/httk-core/issues"

[project.scripts]
httk = "httk.core.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
# httk is a PEP 420 namespace shared across the httk-* repositories, so the
# top-level httk/ has no __init__.py; find must be told to include namespaces or
# it discovers nothing under it. httk.core.project is the anchor package this
# build adds inside httk.core.
namespaces = true

[tool.setuptools.package-data]
"httk.core" = ["py.typed", "optimade_defs/*", "optimade_filter/*.ebnf", "optimade_filter/README.md"]
"httk.core.docs" = ["assets/*"]

[project.optional-dependencies]
default = [
  "numpy>=1.26",
  "cryptography>=42",
]
numpy = ["numpy>=1.26"]
dev = [
  "pytest>=8.0",
  "black",
  "ruff",
  "isort",
  "pyright",
  "mypy",
  "numpy>=1.26"
]
docs = [
  "sphinx",
  "furo",
  "myst-parser",
  "myst-nb",
  "sphinx-autodoc-typehints",
  "sphinx-copybutton",
  "sphinx-autoapi"
]
release = [
  "build>=1.2",
  "twine>=6.0",
]
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.isort]
profile = "black"

[tool.ruff]
target-version = "py312"
src = ["src", "examples"]

[tool.black]
target-version = ["py312"]
line-length = 120
skip-string-normalization = true

[tool.pyright]
pythonVersion = "3.12"
include = ["src", "examples"]
reportMissingImports = true
# The examples import httk as an installed package would; point pyright at the
# in-tree sources so they resolve without relying on an editable install.
extraPaths = ["src"]

[tool.mypy]
python_version = "3.12"
files = ["src", "examples"]
mypy_path = ["src"]
namespace_packages = true
explicit_package_bases = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["yaml", "markdown", "docutils", "docutils.*"]
ignore_missing_imports = true
