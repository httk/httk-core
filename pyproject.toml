[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "httk-core"
version = "2.1.0"
description = "httk₂ core functionality"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Rickard Armiento", email = "rickard-gpg@armiento.net" }]
dependencies = [
]
keywords = [
  "Materials Discovery",
  "Materials Informatics",
  "Materials Science",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://httk.org"
Documentation = "https://docs.httk.org/httk-core/"
Repository = "https://github.com/httk/httk-core"
Issues = "https://github.com/httk/httk-core/issues"

[project.scripts]
httk = "httk.core.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
# httk is a PEP 420 namespace shared across the httk-* repositories, so the
# top-level httk/ has no __init__.py; find must be told to include namespaces or
# it discovers nothing under it. httk.core.project is the anchor package this
# build adds inside httk.core.
namespaces = true

[tool.setuptools.package-data]
"httk.core" = ["py.typed"]
"httk.core.optimade.filter" = ["*.ebnf", "README.md"]
"httk.registry.schemas.core" = ["*.json", "LICENSE", "LICENSE.httk", "README.md"]
"httk.core.docs" = ["assets/*"]

[project.optional-dependencies]
default = [
  "numpy>=1.26",
  "cryptography>=42",
]
numpy = ["numpy>=1.26"]
dev = [
  "pytest>=8.0",
  "pytest-xdist>=3.6",
  "ruff>=0.16,<0.17",
  "pyright",
  "mypy",
  "numpy>=1.26",
  "pydoclint>=0.9,<1"
]
docs = [
  "sphinx",
  "furo",
  "myst-parser",
  "myst-nb",
  "sphinx-autodoc-typehints",
  "sphinx-copybutton",
  "sphinx-autoapi"
]
release = [
  "build>=1.2",
  "twine>=6.0",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n 4 --dist loadgroup -m 'not extended'"
markers = [
  "extended: full-depth test case; selected only by the extended test profile",
]

[tool.ruff]
target-version = "py312"
src = ["src", "examples"]
line-length = 120

[tool.ruff.lint]
# TRY002: raising plain Exception is accepted httk style.
# TRY004: the ValueError/TypeError choice is public API; do not churn it.
# BLE001: broad excepts deliberately isolate plugin/loader/handler failures.
ignore = ["TRY002", "TRY004", "BLE001"]

[tool.ruff.format]
# preserve replaces black's skip-string-normalization: existing quote styles are kept.
quote-style = "preserve"

[tool.pydoclint]
style = "sphinx"
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
check-class-attributes = false
skip-checking-raises = true

[tool.pyright]
pythonVersion = "3.12"
include = ["src", "examples"]
reportMissingImports = true
# The examples import httk as an installed package would; point pyright at the
# in-tree sources so they resolve without relying on an editable install.
extraPaths = ["src"]

[tool.mypy]
python_version = "3.12"
files = ["src", "examples"]
mypy_path = ["src"]
namespace_packages = true
explicit_package_bases = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["yaml", "markdown", "docutils", "docutils.*", "sphinx", "sphinx.*"]
ignore_missing_imports = true
